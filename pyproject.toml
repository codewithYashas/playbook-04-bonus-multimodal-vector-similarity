[project]
name = "playbook-04-bonus-multimodal-vector-similarity"
version = "2026.11.1"
description = "ByteEats vector similarity on LanceDB: ResNet-18 video, frame and image embeddings stored with the media, searched and explored in a Streamlit app (Data Engineering for Multimodal AI, Chapter 4 bonus, ported from FAISS)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26",
    # Same library as opencv-python without the GUI functions, which the code doesn't use
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    # K-Means and HDBSCAN for the Explore tab
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyarrow>=18",
    "lancedb>=0.41",
    "streamlit>=1.50",
    "plotly>=5.20",
    "umap-learn>=0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

# On Linux, PyPI's torch is the CUDA build (several GB of CUDA libraries plus Triton).
# This playbook runs on CPU, so Linux gets the CPU build. macOS and Windows use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "queries", "charts", "debug", "explore"]
